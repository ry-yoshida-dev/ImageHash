[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-hash"
version = "0.0.1"
authors = [
  { name="Ryuto Yoshida"},
]
description = "Compare images using perceptual hash methods (PHash, wavelet hash, etc.)."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "opencv-contrib-python",
    "scipy",
    "PyWavelets",
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/ImageHash"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/ImageHash/issues"

[tool.setuptools]
package-data = { "image_hash" = ["py.typed"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test.py", "test_*.py", "*_test.py"]
filterwarnings = ["error"]

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "scipy-stubs>=1.18.1.1",
]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
